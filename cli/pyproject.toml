[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aist-git-validator"
version = "0.1.0"
description = "AIST Jira commit validator for Git"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[project.scripts]
aistctl = "app.cli:main"